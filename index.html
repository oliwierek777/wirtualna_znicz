<!doctype html>
<html lang="pl-PL">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Znicz Fulara</title>
	<style>
		* { box-sizing: border-box; }

		body {
			min-height: 100vh;
			margin: 0;
			padding: 32px 16px;
			overflow-y: hidden;
			display: grid;
			place-items: center;
			color: #f3eadb;
			background:
				radial-gradient(ellipse at 50% 48%, rgba(181, 133, 63, .16), transparent 280px),
				linear-gradient(145deg, #242522, #151715 72%);
			font-family: Georgia, "Times New Roman", serif;
			text-align: center;
		}

		main { width: min(100%, 560px); }

		.label {
			margin: 0 0 12px;
			color: #c9a96f;
			font: 600 11px/1.4 Arial, sans-serif;
			letter-spacing: .2em;
			text-transform: uppercase;
		}

		h1 {
			margin: 0 0 12px;
			font-size: clamp(36px, 8vw, 56px);
			font-weight: 400;
			line-height: 1.1;
		}

		.candle {
			position: relative;
			width: fit-content;
			margin: 0 auto;
		}

		.candle::before {
			position: absolute;
			z-index: -1;
			inset: 18% 8%;
			border-radius: 50%;
			background: rgba(224, 159, 72, .24);
			filter: blur(38px);
			content: "";
		}

		img {
			display: block;
			width: min(320px, 80vw);
			height: auto;
			filter: drop-shadow(0 10px 24px rgba(0, 0, 0, .35));
		}

		hr {
			width: 42px;
			margin: 8px auto 18px;
			border: 0;
			border-top: 1px solid #c9a96f;
			opacity: .75;
		}

		p {
			margin: 0;
			color: #d3c8b7;
			font-size: clamp(18px, 4vw, 22px);
			line-height: 1.5;
			font-style: italic;
		}

		footer {
			margin-top: 30px;
			color: #938d81;
			font: 10px/1.5 Arial, sans-serif;
			letter-spacing: .14em;
			text-transform: uppercase;
		}
	</style>
</head>
<body>
	<main>
		<div class="label">Światło pamięci</div>
		<h1>Pamiętamy</h1>
		<div class="candle">
			<img src="https://media1.tenor.com/m/484GgFU2sgYAAAAC/candle-light-candle-for-death.gif" alt="Animowany płonący znicz">
		</div>
		<hr>
		<p>„Nie umiera ten, kto trwa w pamięci żywych.”</p>
		<footer>W pamięci tych, których kochamy</footer>
	</main>
</body>
</html>
